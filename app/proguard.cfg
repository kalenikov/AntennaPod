# Fork: the AGP 9 upgrade (upstream #8302) forces getDefaultProguardFile("proguard-android-optimize.txt");
# the old "proguard-android.txt" implied -dontoptimize and is now rejected outright. Under the
# optimizing defaults R8 stripped the constructor of androidx.work.impl.WorkDatabase_Impl, which Room
# only ever creates reflectively via Room.getGeneratedImplementation, so the release APK died at
# startup with NoSuchMethodException before any UI appeared (fork.32). Keep -dontoptimize to restore
# the behaviour every earlier fork release shipped with, and keep Room's generated constructors.
# Debug builds cannot catch this because minifyEnabled is off there — always smoke-test release.
-dontoptimize
-keep class * extends androidx.room.RoomDatabase { <init>(); }
-keepclassmembers class * extends androidx.room.RoomDatabase { <init>(); }

-dontobfuscate
-renamesourcefileattribute SourceFile
-keepattributes SourceFile,LineNumberTable
-optimizations !code/allocation/variable
-optimizationpasses 5

-allowaccessmodification
-dontskipnonpubliclibraryclassmembers

# Keep our own classes and members. They are all used.
# Without this, methods only used in tests are removed and break tests.
-keep class de.danoeh.antennapod**
-keepclassmembers class de.danoeh.antennapod** {*;}
-keep class de.test.antennapod**
-keepclassmembers class de.test.antennapod** {*;}

# Keep methods used in tests.
# This is only needed when running tests with proguard enabled.
-keepclassmembers class org.apache.commons.lang3.StringUtils {*;}
-keepclassmembers class androidx.appcompat.app.ActionBar {
    public ** getTitle();
}
-keepclassmembers class org.apache.commons.io.IOUtils {
    public static void write(...);
}

-keep public class org.jsoup.** {
    public *;
}

# android-iconify
-keep class com.joanzapata.** { *; }

# RxJava
-keep class io.reactivex.Single

# Retrofit 2.0
-dontwarn retrofit2.**
-keep class retrofit2.** { *; }
-keepattributes Signature
-keepattributes Exceptions

-keepclasseswithmembers class * {
    @retrofit2.http.* <methods>;
}

# Moshi
-keep class com.squareup.moshi.** { *; }
-keep interface com.squareup.moshi.** { *; }
####

# awaitility
-dontwarn java.beans.BeanInfo
-dontwarn java.beans.Introspector
-dontwarn java.beans.IntrospectionException
-dontwarn java.beans.PropertyDescriptor
-dontwarn java.lang.management.ManagementFactory
-dontwarn java.lang.management.ThreadInfo
-dontwarn java.lang.management.ThreadMXBean
